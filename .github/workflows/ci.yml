name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_BUILD_JOBS: 1
  CARGO_TERM_COLOR: always

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install Genereto
        run: cargo install --git https://github.com/FedericoPonzi/genereto --rev 9a21250e4dcfb93bc7b03cb003619e621ae0b6c4 --locked
      - name: Check generated site
        run: python3 -m unittest discover -s website -p 'test_*.py'
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace --locked --all-targets
      - name: Check browser worker
        run: |
          python3 browser/check.py
          python3 browser/check.py --page app-tests.html
          python3 browser/check.py --page feed-state-tests.html
          python3 browser/check.py --page session-tests.html
      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --workspace --release --locked
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust WASM tools
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown --no-self-update
      - name: Check WASM code
        run: cargo clippy -p murmur-browser --target wasm32-unknown-unknown --release --locked --all-features -- -D warnings
      - name: Build WASM
        run: cargo build -p murmur-browser --target wasm32-unknown-unknown --release --locked
      - name: Install WASM bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Assemble local browser preview
        run: |
          wasm-bindgen --target web --out-dir browser/pkg target/wasm32-unknown-unknown/release/murmur_browser.wasm
          cargo install --git https://github.com/FedericoPonzi/genereto --rev 9a21250e4dcfb93bc7b03cb003619e621ae0b6c4 --locked
          python3 -m unittest discover -s website -p 'test_*.py'
          python3 website/build.py --with-app
          cargo fetch --locked
          python3 website/package.py --output "$RUNNER_TEMP/murmur-local-preview.zip"
      - name: Check credential format and protected storage in browser
        run: |
          cargo build -p murmur-browser --target wasm32-unknown-unknown --release --locked --features vault-tests
          mkdir -p "$RUNNER_TEMP/murmur-vault-tests"
          wasm-bindgen --target web --out-dir "$RUNNER_TEMP/murmur-vault-tests/pkg" target/wasm32-unknown-unknown/release/murmur_browser.wasm
          cp browser/vault-tests.html browser/worker.mjs browser/device-session.mjs browser/storage-tests.html browser/storage-tests.mjs browser/storage-snapshot.mjs browser/test-worker.mjs browser/identity-tests.html browser/identity-tests.mjs browser/reader-tests.html browser/reader-tests.mjs "$RUNNER_TEMP/murmur-vault-tests/"
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page vault-tests.html
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page storage-tests.html
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page identity-tests.html
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page reader-tests.html
      - name: Upload local preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: murmur-local-preview
          path: ${{ runner.temp }}/murmur-local-preview.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
  deploy:
    name: Deploy to VPS
    needs: [site, check, wasm]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: murmur-vps
      cancel-in-progress: false
    steps:
      - name: Reject an outdated deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::main has advanced; deploy its latest successful CI run instead."
            exit 1
          fi
      - name: Download tested preview
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: murmur-local-preview
          path: ${{ runner.temp }}/murmur-artifact
      - name: Prepare public files
        run: |
          python3 -m zipfile -e "$RUNNER_TEMP/murmur-artifact/murmur-local-preview.zip" "$RUNNER_TEMP/murmur-deploy"
          bundle="$RUNNER_TEMP/murmur-deploy/murmur-local-preview"
          (cd "$bundle" && sha256sum --check --quiet SHA256SUMS)
          cp -R "$bundle/licenses" "$bundle/output/licenses"
          cp "$bundle/THIRD-PARTY.json" "$bundle/BUILD.json" "$bundle/Cargo.lock" "$bundle/output/"
      - name: Setup SSH
        env:
          HOST: ${{ vars.HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Publish static website
        env:
          HOST: ${{ vars.HOST }}
        run: |
          site="$RUNNER_TEMP/murmur-deploy/murmur-local-preview/output/"
          target="deployer@$HOST:/data/www/murmur.fponzi.me/"
          rsync -rtpzc --chmod=D755,F644 --exclude='*.html' "$site" "$target"
          rsync -rtpzc --chmod=D755,F644 --include='*/' --include='*.html' --exclude='*' "$site" "$target"
