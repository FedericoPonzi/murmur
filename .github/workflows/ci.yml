name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: stable
  CARGO_BUILD_JOBS: 1
  CARGO_TERM_COLOR: always

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install Genereto
        run: cargo install --git https://github.com/FedericoPonzi/genereto --rev 9a21250e4dcfb93bc7b03cb003619e621ae0b6c4 --locked
      - name: Check generated site
        run: python3 -m unittest discover -s website -p 'test_*.py'
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace --locked --all-targets
      - name: Check browser worker
        run: |
          python3 browser/check.py
          python3 browser/check.py --page app-tests.html
      - name: Run Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Build release
        run: cargo build --workspace --release --locked
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust WASM tools
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown --no-self-update
      - name: Check WASM code
        run: cargo clippy -p murmur-browser --target wasm32-unknown-unknown --release --locked --all-features -- -D warnings
      - name: Build WASM
        run: cargo build -p murmur-browser --target wasm32-unknown-unknown --release --locked
      - name: Install WASM bindings tool
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Check credential format and protected storage in browser
        run: |
          cargo build -p murmur-browser --target wasm32-unknown-unknown --release --locked --features vault-tests
          mkdir -p "$RUNNER_TEMP/murmur-vault-tests"
          wasm-bindgen --target web --out-dir "$RUNNER_TEMP/murmur-vault-tests/pkg" target/wasm32-unknown-unknown/release/murmur_browser.wasm
          cp browser/vault-tests.html browser/worker.mjs browser/storage-tests.html browser/storage-tests.mjs browser/storage-snapshot.mjs browser/test-worker.mjs browser/identity-tests.html browser/identity-tests.mjs browser/reader-tests.html browser/reader-tests.mjs "$RUNNER_TEMP/murmur-vault-tests/"
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page vault-tests.html
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page storage-tests.html
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page identity-tests.html
          python3 browser/check.py --root "$RUNNER_TEMP/murmur-vault-tests" --page reader-tests.html
