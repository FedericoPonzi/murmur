[package]
name = "murmur-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[[bin]]
name = "murmur"
path = "src/main.rs"

[dependencies]
axum = "0.8"
murmur-core = { path = "../murmur-core" }
murmur-model = { path = "../murmur-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
veilid-core = { version = "=0.5.8", default-features = false, features = ["rt-tokio", "enable-crypto-vld0"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
