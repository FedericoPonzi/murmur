[package]
name = "murmur-browser"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
murmur-core = { path = "../murmur-core" }
murmur-model = { path = "../murmur-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
veilid-core = { version = "=0.5.8", default-features = false, features = ["default-wasm"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
